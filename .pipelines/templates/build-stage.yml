# Frontend Build Stage Template
parameters:
  - name: nodeVersion
    type: string
    default: '18.x'

stages:
  - stage: Build
    displayName: 'Build Frontend'
    jobs:
      - job: BuildJob
        displayName: 'Build React App'
        steps:
          - checkout: self
            fetchDepth: 1

          # Install Node.js
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '${{ parameters.nodeVersion }}'

          # Install Dependencies
          - task: Npm@1
            displayName: 'npm install'
            inputs:
              command: 'install'
              workingDir: '$(Build.SourcesDirectory)'

          # Run Linting
          - task: Npm@1
            displayName: 'npm run lint'
            inputs:
              command: 'custom'
              customCommand: 'run lint'
              workingDir: '$(Build.SourcesDirectory)'
            continueOnError: true

          # Build for Development
          - task: Npm@1
            displayName: 'Build for Development'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              command: 'custom'
              customCommand: 'run build'
              workingDir: '$(Build.SourcesDirectory)'
            env:
              NODE_ENV: 'development'

          # Build for Production
          - task: Npm@1
            displayName: 'Build for Production'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            inputs:
              command: 'custom'
              customCommand: 'run build'
              workingDir: '$(Build.SourcesDirectory)'
            env:
              NODE_ENV: 'production'

          # Copy dist folder
          - task: CopyFiles@2
            displayName: 'Copy dist folder'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/dist'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/dist'

          # Copy Deployment Scripts
          - task: CopyFiles@2
            displayName: 'Copy Deployment Scripts'
            inputs:
              SourceFolder: '.pipelines'
              Contents: '**'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/.pipelines'

          # Publish Build Artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'frontend-drop'
              publishLocation: 'Container'
