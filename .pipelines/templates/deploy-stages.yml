# Deployment Stages - Handles both Dev and Prod based on branch
parameters:
  - name: appBaseName
    type: string
    default: 'codeji'
  - name: port
    type: number
    default: 80

stages:
  # Deploy to Development (runs on develop branch)
  - template: deploy-stage.yml
    parameters:
      environment: 'Dev'
      environmentName: '$(EnvironmentName)'
      siteName: '${{ parameters.appBaseName }}-develop'
      port: ${{ parameters.port }}
      vmIP: '$(VM.IP)'
      vmUser: '$(VM.User)'
      vmPassword: '$(VM.Password)'
      frontendPath: '$(DeployPath)'
      condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))"

  # Deploy to Production (runs on main branch)
  - template: deploy-stage.yml
    parameters:
      environment: 'Prod'
      environmentName: '$(EnvironmentName)'
      siteName: '${{ parameters.appBaseName }}-prod'
      port: ${{ parameters.port }}
      vmIP: '$(VM.IP)'
      vmUser: '$(VM.User)'
      vmPassword: '$(VM.Password)'
      frontendPath: '$(DeployPath)'
      condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"
