# Unified Frontend Deployment Template
# Dynamically handles Dev and Prod deployments based on branch
parameters:
  - name: environment
    type: string
    values:
      - Dev
      - Prod
  - name: environmentName
    type: string
    values:
      - Development
      - Production
  - name: siteName
    type: string
  - name: port
    type: number
  - name: condition
    type: string
    default: ''
  - name: vmIP
    type: string
  - name: vmUser
    type: string
  - name: vmPassword
    type: string
  - name: frontendPath
    type: string

stages:
  - stage: Deploy${{ parameters.environment }}
    displayName: 'Deploy to ${{ parameters.environmentName }}'
    dependsOn: Build
    condition: ${{ parameters.condition }}
    variables:
      # Variable group based on environment
      - group: codeji-${{ lower(parameters.environment) }}
    jobs:
      - deployment: DeployTo${{ parameters.environment }}
        displayName: 'Deploy to ${{ parameters.environmentName }} VM'
        environment: '${{ parameters.environmentName }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'frontend-drop'

                # Generate .env file
                - task: PowerShell@2
                  displayName: 'Generate .env file'
                  inputs:
                    targetType: 'filePath'
                    filePath: '$(Pipeline.Workspace)/frontend-drop/.pipelines/scripts/generate-env.ps1'
                    arguments: >
                      -OutputPath "$(Pipeline.Workspace)/frontend-drop/dist"
                      -BaseUrl "$(VITE_BASEURL)"
                      -CaptchaSiteKey "$(VITE_CAPTCHA_SITE_KEY)"
                      -I18nConfigKey "$(VITE_APP_I18N_CONFIG_KEY)"

                # Deploy to Web Server
                - task: PowerShell@2
                  displayName: 'Deploy to ${{ parameters.environmentName }} Web Server'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "=========================================="
                      Write-Host "🚀 Deploying Frontend to ${{ parameters.environmentName }}"
                      Write-Host "   Environment: ${{ parameters.environment }}"
                      Write-Host "   Site: ${{ parameters.siteName }}"
                      Write-Host "   Port: ${{ parameters.port }}"
                      Write-Host "=========================================="

                      $securePassword = ConvertTo-SecureString "${{ parameters.vmPassword }}" -AsPlainText -Force
                      $credential = New-Object System.Management.Automation.PSCredential ("${{ parameters.vmUser }}", $securePassword)

                      Write-Host "🔌 Connecting to VM: ${{ parameters.vmIP }}"
                      $session = New-PSSession -ComputerName "${{ parameters.vmIP }}" -Credential $credential

                      # Create backup for Production only
                      ${{ if eq(parameters.environment, 'Prod') }}:
                        Write-Host "📦 Creating backup of production deployment"
                        Invoke-Command -Session $session -ScriptBlock {
                          param($path)
                          if (Test-Path $path) {
                            $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
                            $backupPath = "$path-backup-$timestamp"
                            Write-Host "📦 Creating backup at: $backupPath"
                            Copy-Item -Path $path -Destination $backupPath -Recurse -Force
                            Write-Host "✅ Backup created"
                          }
                        } -ArgumentList "${{ parameters.frontendPath }}"

                      # Copy scripts to remote server
                      Write-Host "📦 Copying deployment scripts to VM"
                      Copy-Item -Path "$(Pipeline.Workspace)/frontend-drop/.pipelines/scripts/*" -Destination "C:\Temp\deploy-scripts" -ToSession $session -Recurse -Force

                      # Setup IIS Website
                      Write-Host "⚙️  Setting up IIS Website: ${{ parameters.siteName }}"
                      Invoke-Command -Session $session -FilePath "C:\Temp\deploy-scripts\setup-iis-website.ps1" -ArgumentList "${{ parameters.siteName }}", "${{ parameters.frontendPath }}", ${{ parameters.port }}

                      # Copy dist folder
                      Write-Host "📦 Copying frontend files to ${{ parameters.frontendPath }}"
                      Copy-Item -Path "$(Pipeline.Workspace)/frontend-drop/dist/*" -Destination "${{ parameters.frontendPath }}" -ToSession $session -Recurse -Force

                      Write-Host "=========================================="
                      Write-Host "✅ ${{ parameters.environmentName }} frontend deployment completed successfully!"
                      Write-Host "=========================================="

                      Remove-PSSession $session
