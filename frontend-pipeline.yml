# Main Frontend CI/CD Pipeline
# Codeji CMS Frontend (React + TypeScript + Vite)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '*'

pool:
  name: pool-codeji

variables:
  nodeVersion: '18.x'

# Import stage templates
stages:
  # Build Stage
  - template: .pipelines/templates/build-stage.yml
    parameters:
      nodeVersion: $(nodeVersion)

  # Deploy to Development (runs on develop branch)
  - template: .pipelines/templates/deploy-stage.yml
    parameters:
      environment: "Dev"
      environmentName: "$(EnvironmentName)"
      siteName: "codeji-develop"
      port: 80
      vmIP: "$(VM.IP)"
      vmUser: "$(VM.User)"
      vmPassword: "$(VM.Password)"
      frontendPath: "$(DeployPath)"
      condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))"

  # Deploy to Production (runs on main branch)
  - template: .pipelines/templates/deploy-stage.yml
    parameters:
      environment: "Prod"
      environmentName: "$(EnvironmentName)"
      siteName: "codeji-prod"
      port: 80
      vmIP: "$(VM.IP)"
      vmUser: "$(VM.User)"
      vmPassword: "$(VM.Password)"
      frontendPath: "$(DeployPath)"
      condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"
