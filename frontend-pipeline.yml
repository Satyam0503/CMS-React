# Codeji CMS Frontend Pipeline (React + TypeScript + Vite)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "*"

# Environment configuration - add new environments here
parameters:
  - name: environments
    type: object
    default:
      - name: test
        branch: develop
      - name: prod
        branch: main

variables:
  nodeVersion: "18.x"

stages:
  # ============================================
  # Build Stage
  # ============================================
  - stage: Build
    displayName: "Build Frontend"
    pool:
      name: Codeji-Pool
    jobs:
      - job: BuildJob
        displayName: "Build React App"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "$(nodeVersion)"

          - task: Npm@1
            displayName: "npm install"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)"

          - task: Npm@1
            displayName: "npm run lint"
            inputs:
              command: "custom"
              customCommand: "run lint"
              workingDir: "$(Build.SourcesDirectory)"
            continueOnError: true

          - task: Npm@1
            displayName: "Build for Development"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              command: "custom"
              customCommand: "run build"
              workingDir: "$(Build.SourcesDirectory)"
            env:
              NODE_ENV: "development"

          - task: Npm@1
            displayName: "Build for Production"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            inputs:
              command: "custom"
              customCommand: "run build"
              workingDir: "$(Build.SourcesDirectory)"
            env:
              NODE_ENV: "production"

          - task: CopyFiles@2
            displayName: "Copy dist folder"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/dist"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/dist"

          - task: CopyFiles@2
            displayName: "Copy Deployment Scripts"
            inputs:
              SourceFolder: ".pipelines"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/.pipelines"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "frontend-drop"
              publishLocation: "Container"

          - task: PowerShell@2
            displayName: "Cleanup build workspace"
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                foreach ($p in @("$(Build.ArtifactStagingDirectory)", "$(Build.SourcesDirectory)")) {
                  if (Test-Path $p) {
                    Remove-Item -Path "$p\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Write-Host "Cleaned $p"
                  }
                }

  # ============================================
  # Deploy Stages - generated from environments
  # ============================================
  - ${{ each env in parameters.environments }}:
      - stage: Deploy${{ env.name }}
        displayName: "Deploy to ${{ env.name }}"
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/${{ env.branch }}'))
        variables:
          - group: codeji-${{ env.name }}
        jobs:
          - deployment: DeployTo${{ env.name }}
            displayName: "Deploy to ${{ env.name }} VM"
            environment: "Development.CODEJI-SERVER"
            strategy:
              runOnce:
                deploy:
                  steps:
                    - download: current
                      artifact: "frontend-drop"

                    - task: PowerShell@2
                      displayName: "Resolve URLs from AppSettings"
                      inputs:
                        targetType: "inline"
                        script: |
                          $appHost  = ([Uri]"$(AppSettings.AppUrl)").Host
                          $viteBase = "$(AppSettings.APIUrl)".TrimEnd('/')
                          Write-Host "##vso[task.setvariable variable=AppHost]$appHost"
                          Write-Host "##vso[task.setvariable variable=ViteBase]$viteBase"
                          Write-Host "Resolved: AppHost=$appHost, ViteBase=$viteBase"

                    - task: PowerShell@2
                      displayName: "Generate .env file"
                      inputs:
                        targetType: "filePath"
                        filePath: "$(Pipeline.Workspace)/frontend-drop/.pipelines/scripts/generate-env.ps1"
                        arguments: >
                          -OutputPath "$(Pipeline.Workspace)/frontend-drop/dist"
                          -BaseUrl "$(ViteBase)"
                          -CaptchaSiteKey "$(VITE_CAPTCHA_SITE_KEY)"
                          -I18nConfigKey "$(VITE_APP_I18N_CONFIG_KEY)"

                    - task: PowerShell@2
                      displayName: "Deploy to ${{ env.name }} Web Server"
                      inputs:
                        targetType: "inline"
                        script: |
                          $siteName = "crm-${{ env.name }}-app"
                          $deployPath = "$(DeployRoot)\crm-${{ env.name }}\frontend\Codeji.CMS.ReactApp"

                          Write-Host "=========================================="
                          Write-Host "Deploying Frontend to ${{ env.name }}"
                          Write-Host "   Site:     $siteName"
                          Write-Host "   Pool:     $siteName"
                          Write-Host "   Host:     $(AppHost)"
                          Write-Host "   Path:     $deployPath"
                          Write-Host "=========================================="

                          # Create backup for Production only
                          if ("${{ env.name }}" -eq "prod") {
                            if (Test-Path $deployPath) {
                              $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
                              $backupPath = "$deployPath-backup-$timestamp"
                              Copy-Item -Path $deployPath -Destination $backupPath -Recurse -Force
                              Write-Host "Backup created at: $backupPath"
                            }
                          }

                          # Setup IIS Website (creates app pool, site, and host-header binding)
                          & "$(Pipeline.Workspace)/frontend-drop/.pipelines/scripts/setup-iis-website.ps1" `
                            -SiteName $siteName `
                            -PhysicalPath $deployPath `
                            -Port 80 `
                            -HostName "$(AppHost)" `
                            -AppPoolName $siteName

                          # Copy dist folder
                          Copy-Item -Path "$(Pipeline.Workspace)/frontend-drop/dist/*" -Destination $deployPath -Recurse -Force

                          Write-Host "=========================================="
                          Write-Host "${{ env.name }} frontend deployment completed!"
                          Write-Host "=========================================="

                    - task: PowerShell@2
                      displayName: "Cleanup downloaded artifact"
                      condition: always()
                      inputs:
                        targetType: "inline"
                        script: |
                          $artifactDir = "$(Pipeline.Workspace)\frontend-drop"
                          if (Test-Path $artifactDir) {
                            Remove-Item -Path $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
                            Write-Host "Cleaned up $artifactDir"
                          }
