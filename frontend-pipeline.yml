# Codeji CMS Frontend Pipeline (React + TypeScript + Vite)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "*"

# Environment configuration - add new environments here
parameters:
  - name: environments
    type: object
    default:
      - name: test
        branch: develop
      - name: prod
        branch: main

variables:
  nodeVersion: "18.x"

stages:
  # ============================================
  # Build Stage
  # ============================================
  - stage: Build
    displayName: "Build Frontend"
    pool:
      name: Codeji-Pool
    variables:
      - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
          - group: codeji-test
      - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
          - group: codeji-prod
    jobs:
      - job: BuildJob
        displayName: "Build React App"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "$(nodeVersion)"

          - task: Npm@1
            displayName: "npm install"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)"

          - task: Npm@1
            displayName: "npm run lint"
            inputs:
              command: "custom"
              customCommand: "run lint"
              workingDir: "$(Build.SourcesDirectory)"
            continueOnError: true

          # Vite inlines env vars at build time, so .env must exist BEFORE `npm run build`.
          - task: PowerShell@2
            displayName: "Generate .env file (pre-build)"
            inputs:
              targetType: "inline"
              script: |
                $viteBase = "$(AppSettings.APIUrl)".TrimEnd('/')
                $envFile  = Join-Path "$(Build.SourcesDirectory)" ".env"
                @"
                VITE_BASEURL=$viteBase
                VITE_CAPTCHA_SITE_KEY=$(VITE_CAPTCHA_SITE_KEY)
                VITE_APP_I18N_CONFIG_KEY=$(VITE_APP_I18N_CONFIG_KEY)
                "@ | Out-File -FilePath $envFile -Encoding UTF8 -Force
                Write-Host "Wrote $envFile with VITE_BASEURL=$viteBase"

          - task: Npm@1
            displayName: "Build for Development"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
            inputs:
              command: "custom"
              customCommand: "run build"
              workingDir: "$(Build.SourcesDirectory)"
            env:
              NODE_ENV: "development"

          - task: Npm@1
            displayName: "Build for Production"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            inputs:
              command: "custom"
              customCommand: "run build"
              workingDir: "$(Build.SourcesDirectory)"
            env:
              NODE_ENV: "production"

          - task: ArchiveFiles@2
            displayName: "Archive dist folder"
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/dist"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/dist.zip"
              replaceExistingArchive: true

          - task: CopyFiles@2
            displayName: "Copy Deployment Scripts"
            inputs:
              SourceFolder: ".pipelines"
              Contents: "**"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/.pipelines"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "frontend-drop"
              publishLocation: "Container"

          - task: PowerShell@2
            displayName: "Cleanup build workspace"
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                foreach ($p in @("$(Build.ArtifactStagingDirectory)", "$(Build.SourcesDirectory)")) {
                  if (Test-Path $p) {
                    Remove-Item -Path "$p\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Write-Host "Cleaned $p"
                  }
                }

  # ============================================
  # Deploy Stages - generated from environments
  # ============================================
  - ${{ each env in parameters.environments }}:
      - stage: Deploy${{ env.name }}
        displayName: "Deploy to ${{ env.name }}"
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/${{ env.branch }}'))
        variables:
          - group: codeji-${{ env.name }}
        jobs:
          - deployment: DeployTo${{ env.name }}
            displayName: "Deploy to ${{ env.name }} VM"
            environment: "Development.CODEJI-SERVER"
            strategy:
              runOnce:
                deploy:
                  steps:
                    - download: current
                      artifact: "frontend-drop"

                    - task: ExtractFiles@1
                      displayName: "Extract dist zip to staging"
                      inputs:
                        archiveFilePatterns: "$(Pipeline.Workspace)/frontend-drop/dist.zip"
                        destinationFolder: "$(Pipeline.Workspace)/dist-staging"
                        cleanDestinationFolder: true

                    - task: PowerShell@2
                      displayName: "Resolve URLs from AppSettings"
                      inputs:
                        targetType: "inline"
                        script: |
                          $appHost = ([Uri]"$(AppSettings.AppUrl)").Host
                          Write-Host "##vso[task.setvariable variable=AppHost]$appHost"
                          Write-Host "Resolved: AppHost=$appHost"

                    - task: PowerShell@2
                      displayName: "Deploy to ${{ env.name }} Web Server"
                      inputs:
                        targetType: "inline"
                        script: |
                          $siteName = "crm-${{ env.name }}-app"
                          $deployPath = "$(DeployRoot)\crm-${{ env.name }}\frontend\Codeji.CMS.ReactApp"

                          Write-Host "=========================================="
                          Write-Host "Deploying Frontend to ${{ env.name }}"
                          Write-Host "   Site:     $siteName"
                          Write-Host "   Pool:     $siteName"
                          Write-Host "   Host:     $(AppHost)"
                          Write-Host "   Path:     $deployPath"
                          Write-Host "=========================================="

                          # Create backup for Production only
                          if ("${{ env.name }}" -eq "prod") {
                            if (Test-Path $deployPath) {
                              $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
                              $backupPath = "$deployPath-backup-$timestamp"
                              Copy-Item -Path $deployPath -Destination $backupPath -Recurse -Force
                              Write-Host "Backup created at: $backupPath"
                            }
                          }

                          # Setup IIS Website (creates app pool, site, and host-header binding)
                          & "$(Pipeline.Workspace)/frontend-drop/.pipelines/scripts/setup-iis-website.ps1" `
                            -SiteName $siteName `
                            -PhysicalPath $deployPath `
                            -Port 80 `
                            -HostName "$(AppHost)" `
                            -AppPoolName $siteName

                          # Copy extracted dist folder
                          Copy-Item -Path "$(Pipeline.Workspace)/dist-staging/*" -Destination $deployPath -Recurse -Force

                          Write-Host "=========================================="
                          Write-Host "${{ env.name }} frontend deployment completed!"
                          Write-Host "=========================================="

                    - task: PowerShell@2
                      displayName: "Cleanup downloaded artifact"
                      condition: always()
                      inputs:
                        targetType: "inline"
                        script: |
                          foreach ($p in @("$(Pipeline.Workspace)\frontend-drop", "$(Pipeline.Workspace)\dist-staging")) {
                            if (Test-Path $p) {
                              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
                              Write-Host "Cleaned up $p"
                            }
                          }
