<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="All in one platform to manange employees,recruitment"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Codeji Infotech Pvt Ltd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="media/logos/favicon.png" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--begin::Theme mode setup on page load-->
    <script>
      let themeMode = "system";

      try {
        const stored = localStorage.getItem("mui-mode");
        if (stored) {
          themeMode = stored;
        }
      } catch (e) {}

      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      const isDark = themeMode === "dark";
      const root = document.documentElement;
      root.setAttribute("data-theme", themeMode);
      root.setAttribute("data-bs-theme", themeMode);
      if (isDark) {
        root.classList.add("dark");
        root.style.colorScheme = "dark";
      } else {
        root.classList.remove("dark");
        root.style.colorScheme = "light";
      }
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
