<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="All in one platform to manange employees,recruitment"
    />
    <title>Codeji Infotech Pvt Ltd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="media/logos/favicon.png" />
    <link
      rel="stylesheet"
      id="layout-styles-anchor"
      href="/src/_themes/assets/sass/core/components/spalsh-screen.scss"
    />
  </head>

  <body class="page-loading">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--begin::Theme mode setup on page load-->
    <script>
      let themeMode = "system";

      if (localStorage.getItem("mui-mode")) {
        themeMode = localStorage.getItem("mui-mode");
      }

      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.setAttribute("data-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="root"></div>

    <!--begin::Loading markup-->
    <div id="splash-screen" class="splash-screen">
      <img src="/media/logos/favicon.png" class="dark-logo" alt="Logo" />
      <img src="/media/logos/favicon.png" class="light-logo" alt="Logo" />
      <span>Loading ...</span>
    </div>
    <!--end::Loading markup-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
